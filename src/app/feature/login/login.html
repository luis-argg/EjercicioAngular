<div class="auth-pagina">
  <div class="auth-card">
    <a routerLink="/home" class="auth-logo">The <span>Strokes</span></a>

    <h1>Iniciar sesión</h1>
    <p class="auth-subtitulo">Bienvenido de vuelta al club de fans.</p>

    <form class="auth-form">
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          placeholder="tu@correo.com"
          autocomplete="email"
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn-primario">Entrar</button>
    </form>

    <p class="auth-pie">
      ¿No tienes cuenta?
      <a routerLink="/register">Regístrate aquí</a>
    </p>

    <a routerLink="/home" class="auth-volver">← Volver al inicio</a>
  </div>
</div>
